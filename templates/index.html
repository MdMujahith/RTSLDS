<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge AI - Translator</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.4.1/socket.io.min.js"></script>
</head>
<body class="bg-light">

    <div class="container py-4">
        <!-- Header -->
        <div class="header d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
            <div class="d-flex align-items-center">
                <i class="bi bi-translate fs-2 text-primary me-3"></i>
                <div>
                    <h2 class="title m-0 fw-bold text-primary">SignBridge AI - Translator</h2>
                    <small class="text-muted">Real-time Sign Language Translation</small>
                </div>
            </div>
            <div>
                <span id="connectionStatus" class="badge bg-secondary">Connecting...</span>
                <button id="settingsBtn" class="btn btn-light btn-sm ms-2 border">
                    <i class="bi bi-gear"></i>
                </button>
            </div>
        </div>

        <!-- Mode Selection -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-2">
                        <div class="btn-group w-100" role="group">
                            <button type="button" class="btn btn-outline-primary fw-bold active" id="aslBtn">
                                American Sign Language (ASL)
                            </button>
                            <button type="button" class="btn btn-outline-primary fw-bold" id="islBtn">
                                Indian Sign Language (ISL)
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Left Column: Video Feed -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body p-0">
                        <div class="webcam-container position-relative bg-dark rounded-top overflow-hidden d-flex align-items-center justify-content-center">
                            
                            <!-- Placeholder for when camera is off -->
                            <div id="videoPlaceholder" class="text-center text-white">
                                <i class="bi bi-camera-video-off display-4 mb-3 opacity-50"></i>
                                <h5>Camera Inactive</h5>
                                <p class="small opacity-75">Click "Start Detection" to begin</p>
                            </div>

                            <!-- The Live Video Feed -->
                            <img id="videoElement" src="" alt="Webcam Feed" style="display: none; width: 100%; height: 100%; object-fit: contain;">
                        </div>
                        
                        <!-- Control Bar -->
                        <div class="p-3 bg-white border-top rounded-bottom">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <span id="statusIndicator" class="status-indicator status-inactive"></span>
                                    <span id="statusText" class="small fw-bold text-muted">Ready</span>
                                </div>

                                <div class="d-flex gap-2">
                                    <button id="startStopBtn" class="btn btn-primary px-4 fw-bold">
                                        <i class="bi bi-play-fill"></i> <span id="startStopText">Start Detection</span>
                                    </button>
                                    <button id="captureBtn" class="btn btn-outline-secondary" title="Save Screenshot" disabled>
                                        <i class="bi bi-camera"></i>
                                    </button>
                                    <button id="resetBtn" class="btn btn-outline-danger" title="Reset All">
                                        <i class="bi bi-arrow-counterclockwise"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right Column: Results -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body d-flex flex-column">
                        
                        <!-- Live Output -->
                        <div class="mb-4">
                            <h6 class="text-uppercase text-muted small fw-bold mb-2">Live Detection</h6>
                            <div class="p-3 bg-light rounded text-center border">
                                <div id="detectedSigns" class="display-6 fw-bold text-primary mb-2" style="min-height: 50px;">...</div>
                                
                                <!-- Confidence Bar -->
                                <div class="d-flex align-items-center gap-2 mt-2">
                                    <span class="badge bg-secondary small">Conf</span>
                                    <div class="progress flex-grow-1" style="height: 6px;">
                                        <div id="confidenceFill" class="progress-bar bg-primary" role="progressbar" style="width: 0%"></div>
                                    </div>
                                    <span id="confidenceValue" class="small fw-bold text-muted">0%</span>
                                </div>
                            </div>
                        </div>

                        <!-- Sentence Translation -->
                        <div class="mb-4">
                            <h6 class="text-uppercase text-muted small fw-bold mb-2">Translated Sentence</h6>
                            <div class="p-3 bg-primary bg-opacity-10 border border-primary border-opacity-25 rounded">
                                <p id="translatedText" class="fs-5 mb-0 fw-medium text-dark" style="min-height: 3rem;">
                                    Waiting for input...
                                </p>
                            </div>
                        </div>

                        <!-- History -->
                        <div class="flex-grow-1 d-flex flex-column" style="min-height: 200px;">
                            <h6 class="text-uppercase text-muted small fw-bold mb-2 d-flex justify-content-between">
                                History
                                <small class="text-primary cursor-pointer" onclick="clearHistory()" style="cursor: pointer;">Clear</small>
                            </h6>
                            <div id="historyContainer" class="flex-grow-1 bg-light rounded border p-2 overflow-auto" style="max-height: 250px;">
                                <div class="text-center text-muted py-5 small">
                                    <i class="bi bi-clock-history mb-2 d-block fs-4"></i>
                                    No history yet
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Hidden Audio Player -->
        <audio id="audioPlayer" style="display:none;"></audio>
        
        <div class="text-center mt-5 text-muted small">
            Powered by YOLOv8 & Flask-SocketIO
        </div>
    </div>

    <!-- Logic Script -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
